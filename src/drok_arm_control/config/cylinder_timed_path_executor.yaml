version: 1

interfaces:
  joint_state_topic: /joint_states
  arm_action: /arm_controller/follow_joint_trajectory

execution:
  # 첫 MuJoCo 재생은 계산된 속도의 50%로 수행
  speed_scale: 0.50

  action_server_timeout_sec: 10.0
  joint_state_timeout_sec: 10.0
  action_result_margin_sec: 5.0

validation:
  # 각 block 시작 전 실제 관절과 경로 시작점 비교
  maximum_start_error_rad: 0.030

  # action 종료 후 실제 관절과 목표점 비교
  maximum_goal_error_rad: 0.030

entry_motion:
  # 현재 자세 → PICK_PREGRASP의 별도 Poly5
  duration_margin: 1.10
  minimum_duration_sec: 1.00
